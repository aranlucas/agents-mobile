name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EAS_BUILD_PLATFORM: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        env:
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Configure Gradle for CI
        working-directory: android
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m/' gradle.properties
          sed -i 's/reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' gradle.properties
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agents-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
