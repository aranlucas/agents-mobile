# pnpm 12 settings for this standalone app; there are no workspace packages.
minimumReleaseAge: 0

overrides:
  "react-native-markdown-display>markdown-it": "14.3.1"
  "xcode@3>uuid": "11.1.1"

allowBuilds:
  "@clerk/shared": true
  "@scarf/scarf": false
  "@sentry/cli": false
  browser-tabs-lock: false
  bufferutil: true
  "core-js": true
  "core-js-pure": true
  # EAS logging supports an optional JavaScript fallback without native DTrace.
  "dtrace-provider": false
  esbuild: true
  # The pinned EAS dependency only checks protobuf dependency version syntax.
  protobufjs: true
  "utf-8-validate": true
